<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2500" viewBox="0 0 2200 2500" role="img" aria-labelledby="title desc">
  <title id="title">Логическая схема данных платформы онлайн-рекрутинга</title>
  <desc id="desc">23 логических набора данных без выбора СУБД и шардинга. Показаны поля аккаунтов, компаний, сессий, резюме, вакансий, откликов, справочников, ключей идемпотентности, outbox и очереди, поисковых проекций, кешей, счётчиков, файлов и технических журналов. Линии показывают основные отношения, FK и REF в полях задают остальные ссылки.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#142844"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9bb3d1" stroke-opacity=".04"/></pattern>
    <marker id="relation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#54d7f2"/></marker>
    <marker id="derived" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bea5ff"/></marker>
    <style>
      .entity {fill:#102139;stroke:#466481;stroke-width:1.5}
      .core {stroke:#54d7f2}.support {stroke:#bea5ff}.cache {stroke:#62db9a}.files {stroke:#f0bb63}
      .name {font:700 24px Arial,Helvetica,sans-serif;fill:#f1f7ff}
      .field {font:17.5px 'Courier New',monospace;fill:#cad9ed}
      .section {font:700 21px Arial,Helvetica,sans-serif;fill:#a9bdd5;letter-spacing:1px}
      .label {font:17px Arial,Helvetica,sans-serif;fill:#9bdff0}
      .link {fill:none;stroke:#54d7f2;stroke-width:2;marker-end:url(#relation)}
      .copy {fill:none;stroke:#bea5ff;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#derived)}
    </style>
  </defs>
  <rect width="2200" height="2500" rx="28" fill="url(#bg)"/>
  <rect width="2200" height="2500" rx="28" fill="url(#grid)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="50" y="60" font-size="38" font-weight="700" fill="#f5f9ff">Логическая схема данных</text>
    <text x="50" y="98" font-size="21" fill="#a9bdd5">Вакансии · резюме · отклики — без выбора СУБД, реплик и шардинга</text>
    <text x="2150" y="60" font-size="20" text-anchor="end" fill="#8fdcf0">23 логических набора</text>
    <text x="2150" y="95" font-size="18" text-anchor="end" fill="#9fb4cf">PK — ключ · FK — связь · REF — источник копии</text>

    <!-- Main relationships. All other references are explicit in the fields. -->
    <path class="link" d="M275 180V145H1925V178"/>
    <text x="1020" y="135" class="label">users → company_members · 1:N</text>
    <path class="link" d="M500 345H598"/><text x="535" y="331" class="label">1:1</text>
    <path class="link" d="M1600 345H1698"/><text x="1635" y="331" class="label">1:N</text>
    <path class="link" d="M275 500V578"/><text x="292" y="548" class="label">1:N</text>
    <path class="link" d="M460 500V540H825V578"/><text x="650" y="529" class="label">1:N</text>
    <path class="link" d="M1375 500V578"/><text x="1392" y="548" class="label">1:N</text>
    <path class="link" d="M1600 780H1698"/><text x="1635" y="765" class="label">1:N</text>
    <path class="link" d="M825 980V1025H1925V982"/><text x="1210" y="1013" class="label">resumes → applications · 1:N</text>
    <path class="copy" d="M1375 980V1108"/><text x="1395" y="1060" class="label">изменение + событие</text>
    <path class="copy" d="M1600 1300H1698"/><text x="1620" y="1285" class="label">event</text>
    <path class="copy" d="M1925 1410V1440H275V1468"/>
    <path class="link" d="M1600 1950H1698"/><text x="1635" y="1935" class="label">1:1</text>
    <path class="copy" d="M1925 2070V2100H275V2138"/>
    <text x="1025" y="2090" class="label">версионированная копия файла</text>
    <path class="copy" d="M1050 2295H1148"/><text x="1070" y="2280" class="label">лог</text>

    <!-- Row 1: accounts and companies. -->
    <g transform="translate(50 180)" data-entity="users" data-panel="true">
      <rect class="entity core" width="450" height="320" rx="18"/>
      <text class="name" x="22" y="40">users</text>
      <text class="field" x="22" y="80"><tspan x="22">user_id PK</tspan><tspan x="22" dy="26">email_normalized UQ</tspan><tspan x="22" dy="26">password_hash</tspan><tspan x="22" dy="26">role: seeker | employer</tspan><tspan x="22" dy="26">state</tspan><tspan x="22" dy="26">created_at, updated_at</tspan></text>
    </g>
    <g transform="translate(600 180)" data-entity="profiles" data-panel="true">
      <rect class="entity core" width="450" height="320" rx="18"/>
      <text class="name" x="22" y="40">profiles</text>
      <text class="field" x="22" y="80"><tspan x="22">user_id PK, FK → users</tspan><tspan x="22" dy="26">display_name, contacts</tspan><tspan x="22" dy="26">region_code FK → reference_values</tspan><tspan x="22" dy="26">preferences</tspan><tspan x="22" dy="26">version, updated_at</tspan></text>
    </g>
    <g transform="translate(1150 180)" data-entity="companies" data-panel="true">
      <rect class="entity core" width="450" height="320" rx="18"/>
      <text class="name" x="22" y="40">companies</text>
      <text class="field" x="22" y="80"><tspan x="22">company_id PK</tspan><tspan x="22" dy="26">name, description</tspan><tspan x="22" dy="26">contacts, state</tspan><tspan x="22" dy="26">created_at, updated_at</tspan><tspan x="22" dy="26">version</tspan></text>
    </g>
    <g transform="translate(1700 180)" data-entity="company_members" data-panel="true">
      <rect class="entity core" width="450" height="320" rx="18"/>
      <text class="name" x="22" y="40">company_members</text>
      <text class="field" x="22" y="80"><tspan x="22">PK (company_id, user_id)</tspan><tspan x="22" dy="26">company_id FK → companies</tspan><tspan x="22" dy="26">user_id FK → users</tspan><tspan x="22" dy="26">role, is_active</tspan><tspan x="22" dy="26">created_at, updated_at</tspan></text>
    </g>

    <!-- Row 2: core product data. -->
    <g transform="translate(50 580)" data-entity="sessions" data-panel="true">
      <rect class="entity core" width="450" height="400" rx="18"/>
      <text class="name" x="22" y="40">sessions</text>
      <text class="field" x="22" y="80"><tspan x="22">session_id PK</tspan><tspan x="22" dy="26">user_id FK → users</tspan><tspan x="22" dy="26">refresh_digest, generation</tspan><tspan x="22" dy="26">device_id</tspan><tspan x="22" dy="26">expires_at, revoked_at</tspan><tspan x="22" dy="26">created_at, updated_at</tspan></text>
    </g>
    <g transform="translate(600 580)" data-entity="resumes" data-panel="true">
      <rect class="entity core" width="450" height="400" rx="18"/>
      <text class="name" x="22" y="40">resumes</text>
      <text class="field" x="22" y="80"><tspan x="22">resume_id PK</tspan><tspan x="22" dy="26">owner_user_id FK → users</tspan><tspan x="22" dy="26">title, contacts, about</tspan><tspan x="22" dy="26">region_code, profession_code</tspan><tspan x="22" dy="26">  FK → reference_values</tspan><tspan x="22" dy="26">experience[], education[], skills[]</tspan><tspan x="22" dy="26">salary_expected, currency</tspan><tspan x="22" dy="26">work_formats[], experience_level</tspan><tspan x="22" dy="26">publication_status, version</tspan><tspan x="22" dy="26">created_at, updated_at</tspan></text>
    </g>
    <g transform="translate(1150 580)" data-entity="vacancies" data-panel="true">
      <rect class="entity core" width="450" height="400" rx="18"/>
      <text class="name" x="22" y="40">vacancies</text>
      <text class="field" x="22" y="80"><tspan x="22">vacancy_id PK</tspan><tspan x="22" dy="26">company_id FK → companies</tspan><tspan x="22" dy="26">author_user_id FK → users</tspan><tspan x="22" dy="26">title, description</tspan><tspan x="22" dy="26">region_code, profession_code</tspan><tspan x="22" dy="26">  FK → reference_values</tspan><tspan x="22" dy="26">salary_from, salary_to, currency</tspan><tspan x="22" dy="26">work_format, experience_level</tspan><tspan x="22" dy="26">status, published_at, expires_at</tspan><tspan x="22" dy="26">version, created_at, updated_at</tspan></text>
    </g>
    <g transform="translate(1700 580)" data-entity="applications" data-panel="true">
      <rect class="entity core" width="450" height="400" rx="18"/>
      <text class="name" x="22" y="40">applications</text>
      <text class="field" x="22" y="80"><tspan x="22">application_id PK</tspan><tspan x="22" dy="26">applicant_user_id FK → users</tspan><tspan x="22" dy="26">resume_id FK → resumes</tspan><tspan x="22" dy="26">vacancy_id FK → vacancies</tspan><tspan x="22" dy="26">company_id FK → companies</tspan><tspan x="22" dy="26">status, is_active, summary</tspan><tspan x="22" dy="26">checked_resume_version</tspan><tspan x="22" dy="26">checked_vacancy_version</tspan><tspan x="22" dy="26">accepted_at, status_changed_at</tspan><tspan x="22" dy="26">version</tspan><tspan x="22" dy="26">UQ active (vacancy_id, resume_id)</tspan></text>
    </g>

    <text class="section" x="50" y="1070">ПРОЕКЦИИ И СЛУЖЕБНЫЕ ДАННЫЕ</text>
    <text x="50" y="1096" font-size="17" fill="#9fb4cf">Кеши и поиск восстанавливаются; критические записи и недоставленные события — нет</text>

    <!-- Row 3: dictionaries, idempotency and event delivery. -->
    <g transform="translate(50 1110)" data-entity="reference_values" data-panel="true">
      <rect class="entity support" width="450" height="300" rx="18"/>
      <text class="name" x="22" y="40">reference_values</text>
      <text class="field" x="22" y="80"><tspan x="22">PK (kind, code)</tspan><tspan x="22" dy="26">name</tspan><tspan x="22" dy="26">parent_code REF → reference_values</tspan><tspan x="22" dy="26">is_active, version</tspan><tspan x="22" dy="26">updated_at</tspan></text>
    </g>
    <g transform="translate(600 1110)" data-entity="idempotency_keys" data-panel="true">
      <rect class="entity support" width="450" height="300" rx="18"/>
      <text class="name" x="22" y="40">idempotency_keys</text>
      <text class="field" x="22" y="80"><tspan x="22">PK (actor_key, route, client_key)</tspan><tspan x="22" dy="26">actor_user_id FK → users (optional)</tspan><tspan x="22" dy="26">request_hash, state</tspan><tspan x="22" dy="26">result_code, result_id REF</tspan><tspan x="22" dy="26">created_at, completed_at</tspan><tspan x="22" dy="26">expires_at</tspan></text>
    </g>
    <g transform="translate(1150 1110)" data-entity="outbox_events" data-panel="true">
      <rect class="entity support" width="450" height="300" rx="18"/>
      <text class="name" x="22" y="40">outbox_events</text>
      <text class="field" x="22" y="80"><tspan x="22">event_id PK</tspan><tspan x="22" dy="26">vacancy_id FK → vacancies</tspan><tspan x="22" dy="26">vacancy_version, event_type</tspan><tspan x="22" dy="26">created_at, delivered_at</tspan><tspan x="22" dy="26">retry_count, next_attempt_at</tspan><tspan x="22" dy="26">expires_at (after delivery)</tspan></text>
    </g>
    <g transform="translate(1700 1110)" data-entity="event_queue" data-panel="true">
      <rect class="entity support" width="450" height="300" rx="18"/>
      <text class="name" x="22" y="40">event_queue</text>
      <text class="field" x="22" y="80"><tspan x="22">event_id PK, REF → outbox_events</tspan><tspan x="22" dy="26">vacancy_id REF → vacancies</tspan><tspan x="22" dy="26">vacancy_version, event_type</tspan><tspan x="22" dy="26">enqueued_at, available_at</tspan><tspan x="22" dy="26">acked_at, delivery_count</tspan><tspan x="22" dy="26">expires_at (after processing)</tspan></text>
    </g>

    <!-- Row 4: consumer deduplication, search and public caches. -->
    <g transform="translate(50 1470)" data-entity="consumer_receipts" data-panel="true">
      <rect class="entity support" width="450" height="280" rx="18"/>
      <text class="name" x="22" y="40">consumer_receipts</text>
      <text class="field" x="22" y="80"><tspan x="22">PK (consumer_id, event_id)</tspan><tspan x="22" dy="26">event_id REF → event_queue</tspan><tspan x="22" dy="26">processed_at, expires_at</tspan></text>
    </g>
    <g transform="translate(600 1470)" data-entity="vacancy_search" data-panel="true">
      <rect class="entity cache" width="450" height="280" rx="18"/>
      <text class="name" x="22" y="40">vacancy_search</text>
      <text class="field" x="22" y="80"><tspan x="22">vacancy_id PK, REF → vacancies</tspan><tspan x="22" dy="26">title, description, company_brief</tspan><tspan x="22" dy="26">region_code, profession_code</tspan><tspan x="22" dy="26">salary_from, salary_to, currency</tspan><tspan x="22" dy="26">work_format, experience_level</tspan><tspan x="22" dy="26">published_at, expires_at, version</tspan><tspan x="22" dy="26">status</tspan></text>
    </g>
    <g transform="translate(1150 1470)" data-entity="vacancy_cache" data-panel="true">
      <rect class="entity cache" width="450" height="280" rx="18"/>
      <text class="name" x="22" y="40">vacancy_cache</text>
      <text class="field" x="22" y="80"><tspan x="22">vacancy_id PK, REF → vacancies</tspan><tspan x="22" dy="26">response_payload, version</tspan><tspan x="22" dy="26">cached_at, expires_at</tspan><tspan x="22" dy="26">TTL 60 seconds</tspan></text>
    </g>
    <g transform="translate(1700 1470)" data-entity="search_cache" data-panel="true">
      <rect class="entity cache" width="450" height="280" rx="18"/>
      <text class="name" x="22" y="40">search_cache</text>
      <text class="field" x="22" y="80"><tspan x="22">query_hash PK</tspan><tspan x="22" dy="26">filters, sort, locale, cursor</tspan><tspan x="22" dy="26">results[] REF → vacancy_search</tspan><tspan x="22" dy="26">next_cursor, cached_at, expires_at</tspan><tspan x="22" dy="26">TTL 30 seconds</tspan></text>
    </g>

    <!-- Row 5: rate limits and immutable file storage. -->
    <g transform="translate(50 1810)" data-entity="reference_cache" data-panel="true">
      <rect class="entity cache" width="450" height="260" rx="18"/>
      <text class="name" x="22" y="40">reference_cache</text>
      <text class="field" x="22" y="80"><tspan x="22">PK (kind, code)</tspan><tspan x="22" dy="26">REF → reference_values</tspan><tspan x="22" dy="26">value, dictionary_version</tspan><tspan x="22" dy="26">loaded_at</tspan></text>
    </g>
    <g transform="translate(600 1810)" data-entity="rate_limit_counters" data-panel="true">
      <rect class="entity cache" width="450" height="260" rx="18"/>
      <text class="name" x="22" y="40">rate_limit_counters</text>
      <text class="field" x="22" y="80"><tspan x="22">PK (scope, subject_hash,</tspan><tspan x="22" dy="26">    window_start)</tspan><tspan x="22" dy="26">count, expires_at</tspan><tspan x="22" dy="26">atomic increment + TTL</tspan></text>
    </g>
    <g transform="translate(1150 1810)" data-entity="file_metadata" data-panel="true">
      <rect class="entity files" width="450" height="260" rx="18"/>
      <text class="name" x="22" y="40">file_metadata</text>
      <text class="field" x="22" y="80"><tspan x="22">file_id PK</tspan><tspan x="22" dy="26">object_key UQ, FK → file_objects</tspan><tspan x="22" dy="26">asset_path, release_version</tspan><tspan x="22" dy="26">mime_type, byte_size, checksum</tspan><tspan x="22" dy="26">created_at</tspan></text>
    </g>
    <g transform="translate(1700 1810)" data-entity="file_objects" data-panel="true">
      <rect class="entity files" width="450" height="260" rx="18"/>
      <text class="name" x="22" y="40">file_objects</text>
      <text class="field" x="22" y="80"><tspan x="22">object_key PK</tspan><tspan x="22" dy="26">data_bytes</tspan><tspan x="22" dy="26">checksum, created_at</tspan><tspan x="22" dy="26">immutable content</tspan></text>
    </g>

    <!-- Row 6: CDN cache and bounded technical logs. -->
    <g transform="translate(50 2140)" data-entity="cdn_cache" data-panel="true">
      <rect class="entity files" width="450" height="260" rx="18"/>
      <text class="name" x="22" y="40">cdn_cache</text>
      <text class="field" x="22" y="80"><tspan x="22">object_key PK, REF → file_objects</tspan><tspan x="22" dy="26">data_bytes, checksum</tspan><tspan x="22" dy="26">cached_at, expires_at</tspan></text>
    </g>
    <g transform="translate(600 2140)" data-entity="request_log_buffer" data-panel="true">
      <rect class="entity support" width="450" height="260" rx="18"/>
      <text class="name" x="22" y="40">request_log_buffer</text>
      <text class="field" x="22" y="80"><tspan x="22">event_id PK</tspan><tspan x="22" dy="26">request_id, timestamp</tspan><tspan x="22" dy="26">method, route, status_code</tspan><tspan x="22" dy="26">latency_ms, actor_hash, dc</tspan><tspan x="22" dy="26">15-minute bounded buffer</tspan></text>
    </g>
    <g transform="translate(1150 2140)" data-entity="request_logs" data-panel="true">
      <rect class="entity support" width="450" height="260" rx="18"/>
      <text class="name" x="22" y="40">request_logs</text>
      <text class="field" x="22" y="80"><tspan x="22">event_id PK</tspan><tspan x="22" dy="26">REF → request_log_buffer</tspan><tspan x="22" dy="26">request_id, timestamp</tspan><tspan x="22" dy="26">method, route, status_code</tspan><tspan x="22" dy="26">latency_ms, actor_hash, dc</tspan><tspan x="22" dy="26">retention: 7 days</tspan></text>
    </g>
    <g transform="translate(1700 2140)" data-panel="true">
      <rect class="entity" width="450" height="260" rx="18"/>
      <text class="name" x="22" y="40">Правила чтения схемы</text>
      <text x="22" y="82" font-size="18" fill="#cad9ed"><tspan x="22">Сплошная линия — связь сущностей</tspan><tspan x="22" dy="28">Пунктир — событие или копирование</tspan><tspan x="22" dy="28">FK/REF подписаны и без линий</tspan><tspan x="22" dy="28">Доступ работодателя — через отклик</tspan><tspan x="22" dy="28">Поискового индекса резюме нет</tspan><tspan x="22" dy="28">Пользовательские файлы — вне MVP</tspan></text>
    </g>

    <text x="50" y="2450" font-size="19" fill="#a9bdd5">Объёмы, QPS чтения/записи, сроки хранения, консистентность и горячие ключи — в разделе 5 README.</text>
    <text x="50" y="2480" font-size="17" fill="#8098b5">Массивы и составные поля обозначают логическое содержимое объекта, а не выбор формата хранения.</text>
  </g>
</svg>
