<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Глобальная балансировка нагрузки между тремя дата-центрами</title>
  <desc id="desc">Самостоятельная архитектурная схема: Anycast DNS и CDN/WAF направляют пользователей в дата-центры Москвы, Казани и Новосибирска. Штатная нагрузка распределена 34, 33 и 33 процента, при отказе одной площадки две оставшиеся принимают по 50 процентов.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.55" stop-color="#0d1d34"/>
      <stop offset="1" stop-color="#142844"/>
    </linearGradient>
    <linearGradient id="edgeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31d5f4"/>
      <stop offset="1" stop-color="#6777ff"/>
    </linearGradient>
    <linearGradient id="mapGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".42"/>
      <stop offset=".34" stop-color="#3b82f6" stop-opacity=".25"/>
      <stop offset=".35" stop-color="#f59e0b" stop-opacity=".42"/>
      <stop offset=".66" stop-color="#f59e0b" stop-opacity=".25"/>
      <stop offset=".67" stop-color="#22c55e" stop-opacity=".42"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity=".25"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9bb3d1" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#54d7f2"/>
    </marker>
    <marker id="arrowFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#b9a4ff"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#background)"/>
  <rect width="1200" height="720" rx="28" fill="url(#grid)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="54" y="58" fill="#f7fbff" font-size="30" font-weight="700">Глобальная балансировка нагрузки</text>
    <text x="54" y="87" fill="#9fb4cf" font-size="15">Три равноправных дата-центра · active-active · резервирование N+1</text>

    <g transform="translate(930 36)">
      <rect width="216" height="52" rx="14" fill="#142b49" stroke="#365575"/>
      <text x="18" y="23" fill="#dcecff" font-size="14" font-weight="700">АВАРИЙНЫЙ РЕЖИМ</text>
      <text x="18" y="42" fill="#8fdcf0" font-size="13">0 / 50% / 50%</text>
    </g>

    <!-- Public edge layer -->
    <g filter="url(#shadow)">
      <rect x="340" y="111" width="580" height="82" rx="24" fill="#102b4a" stroke="url(#edgeGradient)" stroke-width="2"/>
      <circle cx="388" cy="152" r="23" fill="url(#edgeGradient)"/>
      <path d="M375 157c-6-1-8-11-1-15 2-10 17-13 23-4 9-1 12 13 3 17-6 2-18 2-25 2Z" fill="#fff" opacity=".95"/>
      <text x="423" y="144" fill="#f3f8ff" font-size="18" font-weight="700">Anycast DNS + CDN/WAF</text>
      <text x="423" y="169" fill="#a9bdd5" font-size="13">единая публичная точка входа · TLS · DDoS-защита · L7 routing</text>
    </g>

    <!-- User traffic -->
    <g transform="translate(54 126)">
      <rect width="232" height="54" rx="16" fill="#101f36" stroke="#314a67"/>
      <circle cx="29" cy="20" r="8" fill="none" stroke="#c9dcf2" stroke-width="2"/>
      <path d="M15 43c1-11 27-11 28 0" fill="none" stroke="#c9dcf2" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="24" fill="#f0f6ff" font-size="15" font-weight="700">Пользователи в России</text>
      <text x="56" y="43" fill="#8fa9c7" font-size="12">GeoIP + измеренная задержка</text>
    </g>
    <path d="M286 153H326" fill="none" stroke="#54d7f2" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

    <!-- Stylized map of Russia -->
    <path d="M141 264l57 5 41-27 68 10 42-24 63 15 51-22 62 25 49-18 56 20 52-14 42 22 51-10 57 22 52-7 49 25 60-9 47 31 57-2 29 29-21 24-60 2-36 22-63-6-46 24-67-7-43 19-65-14-54 18-54-20-69 10-49-22-54 9-45-27-64 6-37-28-56 1-29-25-49 5-22-27-54-3-18-33-40-12Z" fill="url(#mapGradient)" stroke="#7894b5" stroke-width="1.6" opacity=".95"/>
    <path d="M410 247c23 36 29 83 20 132M688 246c-13 44-12 87 2 134" fill="none" stroke="#d7e5f5" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="5 7"/>
    <text x="169" y="326" fill="#a9c9ff" font-size="12" font-weight="700" letter-spacing="1">ЗАПАД</text>
    <text x="509" y="326" fill="#ffd48a" font-size="12" font-weight="700" letter-spacing="1">ЦЕНТР И ЮГ</text>
    <text x="840" y="326" fill="#91e3ad" font-size="12" font-weight="700" letter-spacing="1">УРАЛ · СИБИРЬ · ДВ</text>

    <!-- Edge to origin routes -->
    <path d="M500 193C466 217 391 228 329 268" fill="none" stroke="#54d7f2" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
    <path d="M600 193V265" fill="none" stroke="#54d7f2" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
    <path d="M700 193c42 28 105 36 158 75" fill="none" stroke="#54d7f2" stroke-width="2.2" marker-end="url(#arrowCyan)"/>

    <!-- DC markers -->
    <g transform="translate(298 282)" filter="url(#glow)">
      <circle r="16" fill="#3b82f6" stroke="#dcecff" stroke-width="3"/>
      <circle r="4" fill="#fff"/>
    </g>
    <g transform="translate(600 282)" filter="url(#glow)">
      <circle r="16" fill="#f59e0b" stroke="#fff0cd" stroke-width="3"/>
      <circle r="4" fill="#fff"/>
    </g>
    <g transform="translate(892 282)" filter="url(#glow)">
      <circle r="16" fill="#22c55e" stroke="#dcfce7" stroke-width="3"/>
      <circle r="4" fill="#fff"/>
    </g>

    <!-- Failover links -->
    <path d="M319 362C392 397 494 397 568 362" fill="none" stroke="#b9a4ff" stroke-width="2" stroke-dasharray="7 7" marker-start="url(#arrowFail)" marker-end="url(#arrowFail)"/>
    <path d="M632 362c71 35 159 35 229 0" fill="none" stroke="#b9a4ff" stroke-width="2" stroke-dasharray="7 7" marker-start="url(#arrowFail)" marker-end="url(#arrowFail)"/>
    <text x="438" y="410" fill="#b9a4ff" font-size="11">перераспределение при отказе</text>
    <text x="729" y="410" fill="#b9a4ff" font-size="11">перераспределение при отказе</text>

    <!-- DC cards -->
    <g transform="translate(112 439)" filter="url(#shadow)">
      <rect width="296" height="126" rx="18" fill="#101f36" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="7" height="126" rx="4" fill="#3b82f6"/>
      <text x="27" y="33" fill="#f5f9ff" font-size="20" font-weight="700">Москва</text>
      <text x="235" y="34" fill="#7fb0ff" font-size="20" font-weight="700">34%</text>
      <text x="27" y="61" fill="#a9bdd5" font-size="13">Москва, Санкт-Петербург, СЗФО</text>
      <line x1="27" y1="76" x2="269" y2="76" stroke="#2d4059"/>
      <text x="27" y="101" fill="#d8e7f8" font-size="13">штатный пик ≈ 2 487 RPS</text>
    </g>

    <g transform="translate(452 439)" filter="url(#shadow)">
      <rect width="296" height="126" rx="18" fill="#101f36" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="7" height="126" rx="4" fill="#f59e0b"/>
      <text x="27" y="33" fill="#f5f9ff" font-size="20" font-weight="700">Казань</text>
      <text x="235" y="34" fill="#ffc766" font-size="20" font-weight="700">33%</text>
      <text x="27" y="61" fill="#a9bdd5" font-size="13">ЦФО без Москвы, ЮФО, СКФО</text>
      <line x1="27" y1="76" x2="269" y2="76" stroke="#2d4059"/>
      <text x="27" y="101" fill="#d8e7f8" font-size="13">штатный пик ≈ 2 414 RPS</text>
    </g>

    <g transform="translate(792 439)" filter="url(#shadow)">
      <rect width="296" height="126" rx="18" fill="#101f36" stroke="#22c55e" stroke-width="1.5"/>
      <rect width="7" height="126" rx="4" fill="#22c55e"/>
      <text x="27" y="33" fill="#f5f9ff" font-size="20" font-weight="700">Новосибирск</text>
      <text x="235" y="34" fill="#71df98" font-size="20" font-weight="700">33%</text>
      <text x="27" y="61" fill="#a9bdd5" font-size="13">ПФО, УФО, СФО и ДФО</text>
      <line x1="27" y1="76" x2="269" y2="76" stroke="#2d4059"/>
      <text x="27" y="101" fill="#d8e7f8" font-size="13">штатный пик ≈ 2 414 RPS</text>
    </g>

    <!-- Footer legend -->
    <g transform="translate(54 615)">
      <rect width="1092" height="69" rx="16" fill="#0a1729" stroke="#263d58"/>
      <line x1="24" y1="25" x2="74" y2="25" stroke="#54d7f2" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
      <text x="89" y="30" fill="#c6d7ea" font-size="12">основной маршрут</text>
      <line x1="224" y1="25" x2="274" y2="25" stroke="#b9a4ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowFail)"/>
      <text x="289" y="30" fill="#c6d7ea" font-size="12">failover</text>
      <circle cx="405" cy="25" r="7" fill="#4b91ff"/>
      <text x="420" y="30" fill="#c6d7ea" font-size="12">origin-ДЦ: unicast</text>
      <text x="24" y="54" fill="#8098b5" font-size="12">Anycast применяется только для публичного DNS и CDN/WAF; origin-адреса не публикуются пользователям.</text>
      <text x="832" y="30" fill="#8fdcf0" font-size="13" font-weight="700">Каждый ДЦ рассчитан на 4 000 RPS</text>
      <text x="832" y="53" fill="#8098b5" font-size="12">при отказе: ≈ 3 658 RPS на площадку</text>
    </g>
  </g>
</svg>
