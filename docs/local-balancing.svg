<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title desc">
  <title id="title">Локальная балансировка нагрузки в одном дата-центре</title>
  <desc id="desc">Одинаковая схема для Москвы, Казани и Новосибирска. CDN подключается по HTTPS к виртуальному unicast-адресу. Два HAProxy с Keepalived работают active-passive по схеме N+1. Четыре NGINX работают active-active по схеме N+1, равной трём плюс один, завершают TLS и выбирают backend. Межсервисные HTTP-запросы балансируются локальными Envoy. Consul состоит из трёх узлов с кворумом два из трёх. Сетевые подключения дублируются по N*2. Целевая мощность ДЦ — 5100 RPS, предварительный предел одного NGINX — 2000 TLS TPS.</desc>
