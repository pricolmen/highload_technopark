      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#142844"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9bb3d1" stroke-opacity=".045"/>
    </pattern>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
